name: Update Radar Data
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v3

      - name: List Files (Debug)
        run: ls -R  # This helps you see if the file is in the wrong folder

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes-dev

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Dependencies
        run: |
          pip install numpy matplotlib pygrib requests

      - name: Run Radar Processor
        # Ensure this matches your filename exactly
        run: python process_radar.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add public/data/*.png public/data/*.json
          git commit -m "Update radar frames [skip ci]" || exit 0
          git push
