<!DOCTYPE html>
<html>
<head>
    <title>Live MRMS Radar</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; background: #1a1a1a; font-family: sans-serif; }
        #map { height: 100vh; width: 100vw; }
        #ui-overlay {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 1000; background: rgba(0,0,0,0.8); color: white;
            padding: 15px 25px; border-radius: 30px; border: 1px solid #444;
            display: flex; align-items: center; gap: 20px; pointer-events: auto;
        }
        .time-display { font-weight: bold; font-size: 1.2rem; min-width: 120px; text-align: center; }
        .controls button { background: #444; border: none; color: white; padding: 8px 15px; cursor: pointer; border-radius: 5px; }
        .controls button:hover { background: #666; }
        /* Add this to your <style> block */
        .leaflet-image-layer {
    /* Prevents browser-side blurring */
    image-rendering: pixelated; 
    image-rendering: crisp-edges;
    image-rendering: -moz-crisp-edges;
}
    </style>
</head>
<body>

<div id="ui-overlay">
    <div id="timestamp" class="time-display">Loading...</div>
    <div class="controls">
        <button onclick="prevFrame()">Prev</button>
        <button id="playPause" onclick="togglePlay()">Pause</button>
        <button onclick="nextFrame()">Next</button>
    </div>
</div>
    

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    
    const map = L.map('map', {
        center: [38.0, -95.0],
        zoom: 5,
        backgroundColor: '#111'
    });

    // Dark theme for radar contrast
    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    let frames = [];
    let currentIndex = 9; // Start at the oldest frame to loop forward
    let isPlaying = true;
    let radarLayer = null;

    async function preloadFrames() {
        for (let i = 0; i < 10; i++) {
            try {
                const res = await fetch(`data/metadata_${i}.json`);
                const meta = await res.json();
                const imgUrl = `data/master${i === 0 ? '' : '_' + i}.png`;
                
                frames[i] = {
                    url: imgUrl,
                    bounds: meta.bounds, // Format: [[South, West], [North, East]]
                    time: meta.time
                };
            } catch (e) { console.error("Missing frame", i); }
        }
        // Start the loop
        updateDisplay();
    }

    function updateDisplay() {
        const frame = frames[currentIndex];
        if (!frame) return;

        // --- THE FIX ---
        // Instead of updating the URL of an existing layer, we create a new 
        // imageOverlay with the EXACT bounds provided by the metadata.
        if (radarLayer) map.removeLayer(radarLayer);
        
        radarLayer = L.imageOverlay(frame.url, frame.bounds, {
            opacity: 0.85,
            interactive: false,
            // Optimization: 'nearest' prevents the browser from blurring 
            // the 0.01 degree pixels during zoom.
            className: 'radar-pixel-layer' 
        }).addTo(map);

        document.getElementById('timestamp').innerText = frame.time;
    }

    function nextFrame() {
        currentIndex = currentIndex === 0 ? 9 : currentIndex - 1;
        updateDisplay();
    }

    function prevFrame() {
        currentIndex = currentIndex === 9 ? 0 : currentIndex + 1;
        updateDisplay();
    }

    function togglePlay() {
        isPlaying = !isPlaying;
        document.getElementById('playPause').innerText = isPlaying ? "Pause" : "Play";
    }

    // Main animation loop
    setInterval(() => {
        if (isPlaying) nextFrame();
    }, 800);

    preloadFrames();
</script>

</body>
</html>
