<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision MRMS | Live Radar</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,"> <style>
        :root {
            --bg-glass: rgba(10, 15, 25, 0.9);
            --accent: #00f2ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        body { margin: 0; padding: 0; background: #010409; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* --- LIQUID GLASS UI CARD --- */
        .ui-card {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 480px;
            background: var(--bg-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .logo { font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; font-weight: 600; }
        #timestamp { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #aaa; }

        .control-grid { display: grid; grid-template-columns: 50px 1fr; gap: 20px; align-items: center; }
        
        #play-btn {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            border: none;
            background: var(--accent);
            color: #000;
            cursor: pointer;
            font-size: 18px;
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #play-btn:hover { transform: scale(1.05); }

        .sliders-container { display: flex; flex-direction: column; gap: 15px; }
        
        /* Range Sliders Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; margin: 0; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #fff;
            border: 2px solid var(--accent);
            margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.4);
        }

        .sub-settings { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; }
        .setting-group { display: flex; align-items: center; gap: 10px; flex: 1; }
        .setting-group i { opacity: 0.6; font-size: 12px; }

        /* Smooth Layer Fading */
        .mapboxgl-canvas { transition: opacity 0.3s; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-card">
        <div class="header">
            <div class="logo">MRMS • Precision Radar</div>
            <div id="timestamp">CONNECTING...</div>
        </div>
        
        <div class="control-grid">
            <button id="play-btn"><i class="fas fa-play"></i></button>
            <div class="sliders-container">
                <input type="range" id="time-slider" min="0" max="0" value="0">
                
                <div class="sub-settings">
                    <div class="setting-group">
                        <i class="fas fa-eye"></i>
                        <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.7">
                    </div>
                    <div class="setting-group">
                        <i class="fas fa-bolt"></i>
                        <input type="range" id="speed-slider" min="1" max="10" step="1" value="6">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. CONFIGURATION
        const TOKEN = 'pk.eyJ1IjoiZ3RnMDExNiIsImEiOiJjbWxsODV6NXAwNThmM2ZwdWlkYm0xNjFlIn0.vI186twXYzY45nnuV5FucQ';
        mapboxgl.accessToken = TOKEN;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [-98, 38], // Central US
            zoom: 3.8,
            projection: 'mercator'
        });

        let frames = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;

        // 2. DATA INITIALIZATION
        async function init() {
            // "Safe Path" Logic: Detect if the script needs 'public/data' or just 'data'
            const currentPath = window.location.pathname;
            const baseDataPath = currentPath.includes('/public/') ? 'data' : 'public/data';
            
            console.log("Locating data at:", baseDataPath);

            for (let i = 0; i < 10; i++) {
                try {
                    const res = await fetch(`${baseDataPath}/metadata_${i}.json?t=${Date.now()}`);
                    if (!res.ok) continue;
                    const meta = await res.json();
                    
                    // Convert metadata bounds to Mapbox coordinates
                    const b = meta.bounds;
                    const mapboxBounds = [b[0][1], b[0][0], b[1][1], b[1][0]];

                    frames.push({
                        id: i,
                        url: `${baseDataPath}/master_${i}.png?t=${Date.now()}`,
                        time: meta.time,
                        bounds: mapboxBounds
                    });
                } catch (e) { console.warn("Skipping frame:", i); }
            }

            if (frames.length === 0) {
                document.getElementById('timestamp').innerText = "DATA NOT FOUND";
                return;
            }

            // Reverse frames so they play in chronological order (Oldest -> Newest)
            frames.reverse(); 
            
            document.getElementById('time-slider').max = frames.length - 1;
            
            // Wait for map style to load before adding sources
            if (map.loaded()) setupRadarLayers();
            else map.on('load', setupRadarLayers);
        }

        // 3. MAP LAYERING
        function setupRadarLayers() {
            // Find a layer (usually road labels) to tuck the radar under
            const layers = map.getStyle().layers;
            const labelLayerId = layers.find(l => l.type === 'symbol' && l.layout['text-field'])?.id;

            frames.forEach((f, idx) => {
                map.addSource(`radar-src-${idx}`, {
                    type: 'image',
                    url: f.url,
                    coordinates: [
                        [f.bounds[0], f.bounds[3]], // TL
                        [f.bounds[2], f.bounds[3]], // TR
                        [f.bounds[2], f.bounds[1]], // BR
                        [f.bounds[0], f.bounds[1]]  // BL
                    ]
                });

                map.addLayer({
                    id: `radar-lyr-${idx}`,
                    type: 'raster',
                    source: `radar-src-${idx}`,
                    paint: { 
                        'raster-opacity': 0, 
                        'raster-fade-duration': 150 // Smooth animation between frames
                    }
                }, labelLayerId);
            });

            updateFrame(frames.length - 1); // Start on latest frame
        }

        // 4. ANIMATION & CONTROLS
        function updateFrame(idx) {
            currentIndex = parseInt(idx);
            const op = parseFloat(document.getElementById('opacity-slider').value);
            
            frames.forEach((_, i) => {
                map.setPaintProperty(`radar-lyr-${i}`, 'raster-opacity', i === currentIndex ? op : 0);
            });

            document.getElementById('timestamp').innerText = frames[currentIndex].time;
            document.getElementById('time-slider').value = currentIndex;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerHTML = isPlaying ? 
                '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if (isPlaying) animate();
            else clearTimeout(playTimer);
        }

        function animate() {
            if (!isPlaying) return;
            let next = (currentIndex + 1) % frames.length;
            updateFrame(next);
            
            // Map speed slider (1-10) to delay (1100ms - 100ms)
            const delay = 1200 - (document.getElementById('speed-slider').value * 110);
            playTimer = setTimeout(animate, delay);
        }

        // EVENT LISTENERS
        document.getElementById('play-btn').onclick = togglePlay;
        
        document.getElementById('time-slider').oninput = (e) => {
            if (isPlaying) togglePlay(); // Pause on scrub
            updateFrame(e.target.value);
        };

        document.getElementById('opacity-slider').oninput = () => updateFrame(currentIndex);

        // Start the engine
        init();
    </script>
</body>
</html>
