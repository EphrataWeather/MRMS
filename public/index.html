<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision MRMS | Live</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root { --bg: rgba(10, 15, 25, 0.9); --accent: #00f2ff; --border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; background: #010409; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* --- CLEAN PRO UI --- */
        .ui-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 480px; background: var(--bg);
            backdrop-filter: blur(15px); border: 1px solid var(--border);
            border-radius: 16px; padding: 20px; z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .logo { font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; font-weight: 600; }
        #timestamp { font-family: 'JetBrains Mono', monospace; font-size: 11px; opacity: 0.7; }

        .control-grid { display: grid; grid-template-columns: 50px 1fr; gap: 15px; align-items: center; }
        
        #play-btn {
            width: 50px; height: 50px; border-radius: 12px; border: none;
            background: var(--accent); color: #000; cursor: pointer; font-size: 18px;
        }

        .sliders { display: flex; flex-direction: column; gap: 12px; }
        
        /* Range Styling */
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; margin: 0; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #fff; border: 2px solid var(--accent); margin-top: -6px;
            box-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
        }

        .sub-controls { display: flex; justify-content: space-between; font-size: 12px; opacity: 0.6; }
        .icon-slider { display: flex; align-items: center; gap: 8px; width: 45%; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-card">
        <div class="header">
            <div class="logo">MRMS • Live Radar</div>
            <div id="timestamp">CONNECTING...</div>
        </div>
        <div class="control-grid">
            <button id="play-btn"><i class="fas fa-play"></i></button>
            <div class="sliders">
                <input type="range" id="time-slider" min="0" max="0" value="0">
                <div class="sub-controls">
                    <div class="icon-slider">
                        <i class="fas fa-eye"></i>
                        <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.7">
                    </div>
                    <div class="icon-slider">
                        <i class="fas fa-bolt"></i>
                        <input type="range" id="speed-slider" min="1" max="10" value="6">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. SETTINGS
        const TOKEN = 'pk.eyJ1IjoiZ3RnMDExNiIsImEiOiJjbWxsODV6NXAwNThmM2ZwdWlkYm0xNjFlIn0.vI186twXYzY45nnuV5FucQ';
        const DATA_PATH = 'public/data'; // Change to 'data' if you don't use a public folder

        mapboxgl.accessToken = TOKEN;
        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [-98, 38],
            zoom: 3.8,
            projection: 'mercator' // Flattens the globe for a cleaner look
        });

        let frames = [];
        let currentIndex = 0;
        let isPlaying = false;

        // 2. LOAD DATA
        async function init() {
            for (let i = 0; i < 10; i++) {
                try {
                    const res = await fetch(`${DATA_PATH}/metadata_${i}.json`);
                    if (!res.ok) continue;
                    const meta = await res.json();
                    frames.push({
                        id: i,
                        url: `${DATA_PATH}/master_${i}.png`,
                        time: meta.time,
                        bounds: [meta.bounds[0][1], meta.bounds[0][0], meta.bounds[1][1], meta.bounds[1][0]]
                    });
                } catch (e) { console.error("Error loading frame", i); }
            }

            if (frames.length === 0) {
                document.getElementById('timestamp').innerText = "DATA NOT FOUND";
                return;
            }

            frames.reverse(); // Newest first
            document.getElementById('time-slider').max = frames.length - 1;
            
            map.on('load', setupLayers);
        }

        function setupLayers() {
            const labelLayerId = map.getStyle().layers.find(l => l.type === 'symbol').id;

            frames.forEach((f, idx) => {
                map.addSource(`radar-${idx}`, {
                    type: 'image', url: f.url,
                    coordinates: [[f.bounds[0], f.bounds[3]], [f.bounds[2], f.bounds[3]], [f.bounds[2], f.bounds[1]], [f.bounds[0], f.bounds[1]]]
                });
                map.addLayer({
                    id: `layer-${idx}`, type: 'raster', source: `radar-${idx}`,
                    paint: { 'raster-opacity': 0, 'raster-fade-duration': 100 }
                }, labelLayerId);
            });
            updateFrame(frames.length - 1);
        }

        function updateFrame(idx) {
            currentIndex = parseInt(idx);
            const op = parseFloat(document.getElementById('opacity-slider').value);
            frames.forEach((_, i) => map.setPaintProperty(`layer-${i}`, 'raster-opacity', i === currentIndex ? op : 0));
            document.getElementById('timestamp').innerText = frames[currentIndex].time;
            document.getElementById('time-slider').value = currentIndex;
        }

        // Logic for Play/Pause and Sliders...
        document.getElementById('play-btn').onclick = () => {
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if(isPlaying) animate();
        };

        function animate() {
            if(!isPlaying) return;
            currentIndex = (currentIndex + 1) % frames.length;
            updateFrame(currentIndex);
            setTimeout(animate, 1100 - (document.getElementById('speed-slider').value * 100));
        }

        document.getElementById('time-slider').oninput = (e) => { isPlaying = false; updateFrame(e.target.value); };

        init();
    </script>
</body>
</html>
