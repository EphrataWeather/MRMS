<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision MRMS | Pro</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-glass: rgba(13, 20, 34, 0.85);
            --accent: #00f2ff;
            --border: rgba(255, 255, 255, 0.1);
        }

        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #010409; color: white; overflow: hidden; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        /* --- LIQUID GLASS UI --- */
        .ui-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 650px;
            background: var(--bg-glass);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 15px 50px rgba(0,0,0,0.8);
            z-index: 10;
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .logo-section h1 { margin: 0; font-size: 14px; letter-spacing: 3px; color: var(--accent); font-weight: 600; text-transform: uppercase; }
        
        #timestamp {
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            background: rgba(0,0,0,0.5);
            padding: 6px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        /* --- CONTROLS --- */
        .controls-wrapper { display: flex; align-items: center; gap: 20px; }
        
        #play-btn {
            width: 54px; height: 54px; border-radius: 18px; border: none;
            background: var(--accent); color: #000; font-size: 20px;
            cursor: pointer; transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex; align-items: center; justify-content: center;
        }
        #play-btn:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0, 242, 255, 0.3); }

        .sliders-group { flex: 1; display: flex; flex-direction: column; gap: 18px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        
        /* Time Slider */
        #time-slider { height: 6px; background: rgba(255,255,255,0.1); border-radius: 10px; }
        #time-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 18px; width: 18px; border-radius: 50%;
            background: white; border: 3px solid var(--accent); box-shadow: 0 0 15px var(--accent);
        }

        .sub-controls { display: flex; gap: 30px; opacity: 0.7; }
        .control-item { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 11px; }
        .mini-slider { height: 3px; background: rgba(255,255,255,0.1); border-radius: 10px; flex: 1; }
        .mini-slider::-webkit-slider-thumb { -webkit-appearance: none; height: 10px; width: 10px; border-radius: 50%; background: white; }

        /* Style Toggles */
        .map-style-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--bg-glass); border: 1px solid var(--border);
            padding: 5px; border-radius: 12px; display: flex; gap: 5px;
        }
        .style-btn {
            padding: 8px 12px; font-size: 11px; border-radius: 8px; border: none;
            background: transparent; color: white; cursor: pointer; transition: 0.2s;
        }
        .style-btn.active { background: rgba(255,255,255,0.1); color: var(--accent); }

    </style>
</head>
<body>

    <div id="map"></div>

    <div class="map-style-toggle">
        <button class="style-btn active" onclick="setStyle('dark')">DARK</button>
        <button class="style-btn" onclick="setStyle('satellite')">SATELLITE</button>
    </div>

    <div class="ui-container">
        <div class="header">
            <div class="logo-section">
                <h1>Precision MRMS</h1>
            </div>
            <div id="timestamp">SYNCING DATA...</div>
        </div>

        <div class="controls-wrapper">
            <button id="play-btn"><i class="fas fa-play"></i></button>
            <div class="sliders-group">
                <input type="range" id="time-slider" min="0" max="9" value="9">
                <div class="sub-controls">
                    <div class="control-item">
                        <i class="fas fa-eye"></i>
                        <input type="range" id="opacity-slider" class="mini-slider" min="0" max="1" step="0.1" value="0.8">
                    </div>
                    <div class="control-item">
                        <i class="fas fa-wind"></i>
                        <input type="range" id="speed-slider" class="mini-slider" min="1" max="10" step="1" value="6">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 1. Initialize Mapbox
        // IMPORTANT: Replace this with your token
        mapboxgl.accessToken = 'pk.eyJ1IjoiZ3RnMDExNiIsImEiOiJjbWxsODV6NXAwNThmM2ZwdWlkYm0xNjFlIn0.vI186twXYzY45nnuV5FucQ';

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [-98, 38],
            zoom: 4,
            pitch: 30, // Slight tilt for premium feel
            antialias: true
        });

        let frames = [];
        let currentIndex = 9;
        let isPlaying = false;
        let playTimer = null;

        const timeSlider = document.getElementById('time-slider');
        const timestamp = document.getElementById('timestamp');
        const playBtn = document.getElementById('play-btn');
        const opacitySlider = document.getElementById('opacity-slider');
        const speedSlider = document.getElementById('speed-slider');

        // 2. Fetch Metadata and Layers
        async function loadRadar() {
            for (let i = 0; i < 10; i++) {
                try {
                    const res = await fetch(`data/metadata_${i}.json?t=${Date.now()}`);
                    if (!res.ok) continue;
                    const meta = await res.json();
                    
                    // Mapbox uses [West, South, East, North] for image source
                    const b = meta.bounds;
                    const mapboxBounds = [b[0][1], b[0][0], b[1][1], b[1][0]];

                    frames.push({
                        id: i,
                        url: `data/master_${i}.png?t=${Date.now()}`,
                        time: meta.time,
                        bounds: mapboxBounds
                    });
                } catch (e) {}
            }
            frames.reverse(); // Oldest to Newest
            
            map.on('load', () => {
                setupRadarLayers();
                updateFrame(frames.length - 1);
            });
        }

        function setupRadarLayers() {
            frames.forEach((f, idx) => {
                map.addSource(`radar-source-${idx}`, {
                    type: 'image',
                    url: f.url,
                    coordinates: [
                        [f.bounds[0], f.bounds[3]], // Top Left
                        [f.bounds[2], f.bounds[3]], // Top Right
                        [f.bounds[2], f.bounds[1]], // Bottom Right
                        [f.bounds[0], f.bounds[1]]  // Bottom Left
                    ]
                });

                // PREMIUM FEATURE: Inject layer BEFORE labels
                // This keeps city names visible on top of the radar
                const labelLayerId = map.getStyle().layers.find(l => l.type === 'symbol').id;

                map.addLayer({
                    id: `radar-layer-${idx}`,
                    type: 'raster',
                    source: `radar-source-${idx}`,
                    paint: { 'raster-opacity': 0, 'raster-fade-duration': 200 }
                }, labelLayerId);
            });
        }

        function updateFrame(idx) {
            currentIndex = parseInt(idx);
            const op = parseFloat(opacitySlider.value);
            
            frames.forEach((_, i) => {
                map.setPaintProperty(`radar-layer-${i}`, 'raster-opacity', i === currentIndex ? op : 0);
            });

            timestamp.innerText = frames[currentIndex].time;
            timeSlider.value = currentIndex;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if (isPlaying) animate();
            else clearTimeout(playTimer);
        }

        function animate() {
            if (!isPlaying) return;
            let next = currentIndex + 1;
            if (next >= frames.length) next = 0;
            updateFrame(next);
            const delay = 1100 - (speedSlider.value * 100);
            playTimer = setTimeout(animate, delay);
        }

        function setStyle(type) {
            const style = type === 'satellite' ? 'mapbox://styles/mapbox/satellite-streets-v12' : 'mapbox://styles/mapbox/dark-v11';
            map.setStyle(style);
            // Re-add radar layers after style changes
            map.once('style.load', setupRadarLayers);
            document.querySelectorAll('.style-btn').forEach(b => b.classList.toggle('active', b.innerText.toLowerCase() === type));
        }

        // Listeners
        timeSlider.oninput = (e) => { isPlaying = false; playBtn.innerHTML = '<i class="fas fa-play"></i>'; updateFrame(e.target.value); };
        opacitySlider.oninput = () => updateFrame(currentIndex);
        playBtn.onclick = togglePlay;

        loadRadar();
    </script>
</body>
</html>
