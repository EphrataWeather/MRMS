<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Precision MRMS | HD Radar</title>
    
    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="data:,">

    <style>
        :root { --bg: rgba(10, 15, 25, 0.9); --accent: #00f2ff; --border: rgba(255, 255, 255, 0.1); }
        body { margin: 0; padding: 0; background: #010409; color: white; overflow: hidden; font-family: 'Inter', sans-serif; }
        #map { position: absolute; top: 0; bottom: 0; width: 100%; }

        .ui-card {
            position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 480px; background: var(--bg);
            backdrop-filter: blur(20px); border: 1px solid var(--border);
            border-radius: 20px; padding: 20px; z-index: 10;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
        }

        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
        .logo { font-size: 11px; letter-spacing: 2px; color: var(--accent); text-transform: uppercase; font-weight: 600; }
        #timestamp { font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #aaa; }

        .control-grid { display: grid; grid-template-columns: 50px 1fr; gap: 20px; align-items: center; }
        #play-btn { width: 50px; height: 50px; border-radius: 14px; border: none; background: var(--accent); color: #000; cursor: pointer; font-size: 18px; }

        .sliders-container { display: flex; flex-direction: column; gap: 15px; }
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; margin: 0; }
        input[type=range]::-webkit-slider-runnable-track { height: 4px; background: rgba(255,255,255,0.1); border-radius: 2px; }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none; height: 16px; width: 16px; border-radius: 50%;
            background: #fff; border: 2px solid var(--accent); margin-top: -6px;
        }

        .sub-settings { display: flex; justify-content: space-between; gap: 20px; font-size: 12px; }
        .setting-group { display: flex; align-items: center; gap: 10px; flex: 1; }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="ui-card">
        <div class="header">
            <div class="logo">MRMS • HD Precision</div>
            <div id="timestamp">CONNECTING...</div>
        </div>
        <div class="control-grid">
            <button id="play-btn"><i class="fas fa-play"></i></button>
            <div class="sliders-container">
                <input type="range" id="time-slider" min="0" max="0" value="0">
                <div class="sub-settings">
                    <div class="setting-group"><i class="fas fa-eye"></i><input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="0.7"></div>
                    <div class="setting-group"><i class="fas fa-bolt"></i><input type="range" id="speed-slider" min="1" max="10" step="1" value="6"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const TOKEN = 'pk.eyJ1IjoiZ3RnMDExNiIsImEiOiJjbWxsODV6NXAwNThmM2ZwdWlkYm0xNjFlIn0.vI186twXYzY45nnuV5FucQ';
        mapboxgl.accessToken = TOKEN;

        const map = new mapboxgl.Map({
            container: 'map',
            style: 'mapbox://styles/mapbox/dark-v11',
            center: [-98, 38],
            zoom: 3.8,
            projection: 'mercator'
        });

        let frames = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;

        async function init() {
            const currentPath = window.location.pathname;
            const baseDataPath = currentPath.includes('/public/') ? 'data' : 'public/data';
            
            for (let i = 0; i < 10; i++) {
                try {
                    const res = await fetch(`${baseDataPath}/metadata_${i}.json?t=${Date.now()}`);
                    if (!res.ok) continue;
                    const meta = await res.json();
                    frames.push({
                        id: i,
                        url: `${baseDataPath}/master_${i}.png?t=${Date.now()}`,
                        time: meta.time,
                        bounds: [meta.bounds[0][1], meta.bounds[0][0], meta.bounds[1][1], meta.bounds[1][0]]
                    });
                } catch (e) {}
            }
            if (frames.length === 0) return;
            frames.reverse(); 
            document.getElementById('time-slider').max = frames.length - 1;
            
            if (map.loaded()) setupRadar();
            else map.on('load', setupRadar);
        }

        function setupRadar() {
            const layers = map.getStyle().layers;
            
            // LOGIC: Find the absolute first layer that contains "admin" (borders) or "label" (text)
            // This ensures we insert radar underneath ALL of them.
            let firstTopLayerId;
            for (const layer of layers) {
                if (layer.id.includes('admin') || layer.id.includes('label') || layer.id.includes('road')) {
                    firstTopLayerId = layer.id;
                    break;
                }
            }

            frames.forEach((f, idx) => {
                map.addSource(`radar-src-${idx}`, {
                    type: 'image',
                    url: f.url,
                    coordinates: [[f.bounds[0], f.bounds[3]], [f.bounds[2], f.bounds[3]], [f.bounds[2], f.bounds[1]], [f.bounds[0], f.bounds[1]]]
                });

                map.addLayer({
                    id: `radar-lyr-${idx}`,
                    type: 'raster',
                    source: `radar-src-${idx}`,
                    paint: { 
                        'raster-opacity': 0, 
                        'raster-fade-duration': 0, // Set to 0 for instant frame switching (higher quality feel)
                        'raster-resampling': 'nearest' // CRITICAL: Keeps radar pixels sharp, no blurring
                    }
                }, firstTopLayerId);
            });

            updateFrame(frames.length - 1);
        }

        function updateFrame(idx) {
            currentIndex = parseInt(idx);
            const op = parseFloat(document.getElementById('opacity-slider').value);
            frames.forEach((_, i) => {
                map.setPaintProperty(`radar-lyr-${i}`, 'raster-opacity', i === currentIndex ? op : 0);
            });
            document.getElementById('timestamp').innerText = frames[currentIndex].time;
            document.getElementById('time-slider').value = currentIndex;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('play-btn').innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            if (isPlaying) animate();
            else clearTimeout(playTimer);
        }

        function animate() {
            if (!isPlaying) return;
            currentIndex = (currentIndex + 1) % frames.length;
            updateFrame(currentIndex);
            const delay = 1200 - (document.getElementById('speed-slider').value * 110);
            playTimer = setTimeout(animate, delay);
        }

        document.getElementById('play-btn').onclick = togglePlay;
        document.getElementById('time-slider').oninput = (e) => { if (isPlaying) togglePlay(); updateFrame(e.target.value); };
        document.getElementById('opacity-slider').oninput = () => updateFrame(currentIndex);

        init();
    </script>
</body>
</html>
