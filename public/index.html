<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MRMS Liquid Radar</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --glass-bg: rgba(6, 12, 26, 0.8);
            --glass-border: rgba(0, 242, 255, 0.3);
            --accent: #00f2ff;
            --text-main: #ffffff;
            --slider-track: rgba(255, 255, 255, 0.15);
        }

        body { margin: 0; padding: 0; background: #020408; font-family: 'Inter', sans-serif; }
        #map { height: 100vh; width: 100vw; background: #020408; }

        /* --- UI: LIQUID GLASS DESIGN --- */
        .glass-panel {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 550px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
            z-index: 1000;
            color: var(--text-main);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title-block h1 { margin: 0; font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: 2px; color: var(--accent); }
        
        #timestamp {
            font-family: 'Monaco', monospace;
            font-size: 14px;
            background: rgba(0,0,0,0.4);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            color: #fff;
        }

        /* --- CONTROLS --- */
        .main-controls { display: flex; align-items: center; gap: 20px; }

        #play-btn {
            width: 50px; height: 50px; border-radius: 50%; border: none;
            background: var(--accent); color: #000; font-size: 18px;
            cursor: pointer; box-shadow: 0 0 15px rgba(0, 242, 255, 0.4);
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s;
        }
        #play-btn:hover { transform: scale(1.05); box-shadow: 0 0 25px rgba(0, 242, 255, 0.6); }

        .sliders-container { flex: 1; display: flex; flex-direction: column; gap: 15px; }

        /* Custom Slider Styling */
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; cursor: pointer; }
        
        /* Time Scrubber Track */
        #time-slider { height: 8px; background: var(--slider-track); border-radius: 4px; }
        #time-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
            background: #fff; box-shadow: 0 0 10px rgba(0,242,255,0.8); margin-top: -6px;
        }

        .sub-settings { display: flex; gap: 25px; align-items: center; }
        .setting-item { display: flex; align-items: center; gap: 10px; flex: 1; font-size: 11px; opacity: 0.8; }
        
        /* Small Sliders */
        .mini-slider { height: 4px; background: var(--slider-track); border-radius: 2px; flex: 1; }
        .mini-slider::-webkit-slider-thumb {
            -webkit-appearance: none; height: 12px; width: 12px; border-radius: 50%;
            background: var(--accent);
        }

        /* --- MAP LAYER FIXES --- */
        .leaflet-image-layer {
            image-rendering: pixelated;
            transition: opacity 0.2s ease-in-out; /* Smooth fade between frames */
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <div class="glass-panel">
        <div class="panel-header">
            <div class="title-block">
                <h1>MRMS Live Radar</h1>
            </div>
            <div id="timestamp">Syncing...</div>
        </div>

        <div class="main-controls">
            <button id="play-btn"><i class="fas fa-play"></i></button>
            
            <div class="sliders-container">
                <input type="range" id="time-slider" min="0" max="9" value="9" step="1">
                
                <div class="sub-settings">
                    <div class="setting-item">
                        <i class="fas fa-layer-group"></i>
                        <input type="range" id="opacity-slider" class="mini-slider" min="0" max="1" step="0.1" value="0.7">
                    </div>
                    <div class="setting-item">
                        <i class="fas fa-bolt"></i>
                        <input type="range" id="speed-slider" class="mini-slider" min="1" max="10" step="1" value="5">
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. Setup Premium Themed Map
        const map = L.map('map', { zoomControl: false }).setView([38.0, -97.0], 4);

        // CREATE PANES (Ordering Layers)
        map.createPane('radarPane').style.zIndex = 400;
        map.createPane('labelsPane').style.zIndex = 600;
        map.getPane('labelsPane').style.pointerEvents = 'none';

        // Base Layer (Dark, No labels)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png').addTo(map);

        // Label Layer (Borders and Town Names - Sits on TOP of radar)
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_only_labels/{z}/{x}/{y}{r}.png', {
            pane: 'labelsPane'
        }).addTo(map);

        // 2. Data State
        let frames = [];
        let layers = [];
        let currentIndex = 0;
        let isPlaying = false;
        let playTimer = null;

        const timeSlider = document.getElementById('time-slider');
        const timestamp = document.getElementById('timestamp');
        const playBtn = document.getElementById('play-btn');
        const opacitySlider = document.getElementById('opacity-slider');
        const speedSlider = document.getElementById('speed-slider');

        async function init() {
            // Load newest to oldest metadata
            for (let i = 0; i < 10; i++) {
                try {
                    const r = await fetch(`data/metadata_${i}.json?t=${Date.now()}`);
                    if (!r.ok) continue;
                    const meta = await r.json();
                    frames.push({
                        id: i,
                        url: `data/master_${i}.png?t=${Date.now()}`,
                        time: meta.time,
                        bounds: meta.bounds
                    });
                } catch(e) {}
            }

            // CRITICAL: We want oldest data on the LEFT of the slider.
            // metadata_0 is newest. metadata_9 is oldest.
            // We reverse so frames[0] is the oldest.
            frames.reverse(); 

            frames.forEach((f, idx) => {
                const layer = L.imageOverlay(f.url, f.bounds, {
                    pane: 'radarPane',
                    opacity: 0,
                    interactive: false
                }).addTo(map);
                layers.push(layer);
            });

            timeSlider.max = frames.length - 1;
            timeSlider.value = frames.length - 1; // Default to newest
            
            // Zoom to show data
            if(frames.length > 0) map.fitBounds(frames[frames.length-1].bounds);
            
            updateFrame(frames.length - 1);
        }

        function updateFrame(idx) {
            currentIndex = parseInt(idx);
            const op = opacitySlider.value;
            
            layers.forEach((l, i) => {
                l.setOpacity(i === currentIndex ? op : 0);
            });

            timestamp.innerText = frames[currentIndex].time;
            timeSlider.value = currentIndex;
        }

        function togglePlay() {
            isPlaying = !isPlaying;
            playBtn.innerHTML = isPlaying ? '<i class="fas fa-pause"></i>' : '<i class="fas fa-play"></i>';
            
            if (isPlaying) {
                const step = () => {
                    if (!isPlaying) return;
                    let next = currentIndex + 1;
                    if (next >= frames.length) next = 0;
                    updateFrame(next);
                    
                    // Calculate delay: 1100ms (slow) down to 100ms (fast)
                    const delay = 1100 - (speedSlider.value * 100);
                    playTimer = setTimeout(step, delay);
                };
                step();
            } else {
                clearTimeout(playTimer);
            }
        }

        // Listeners
        timeSlider.oninput = (e) => { isPlaying = false; pauseUI(); updateFrame(e.target.value); };
        opacitySlider.oninput = () => updateFrame(currentIndex);
        playBtn.onclick = togglePlay;
        
        function pauseUI() { 
            isPlaying = false; 
            playBtn.innerHTML = '<i class="fas fa-play"></i>'; 
            clearTimeout(playTimer); 
        }

        init();
    </script>
</body>
</html>
